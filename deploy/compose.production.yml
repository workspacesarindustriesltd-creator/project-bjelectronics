services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in Dokploy}
      MYSQL_DATABASE: ${DB_NAME:-bj_electronics}
      MYSQL_USER: ${DB_USER:-bj_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      STORE_URL: ${STORE_URL:-https://www.bjelectronics.shop}
      ADMIN_URL: ${ADMIN_URL:-https://admin.bjelectronics.shop}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.bjelectronics.shop}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.bjelectronics.shop}
      JWT_SECRET: ${JWT_SECRET:?Set a JWT_SECRET containing at least 32 characters}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bj_electronics}
      DB_USER: ${DB_USER:-bj_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Dokploy}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      ADMIN_NAME: ${ADMIN_NAME:-Store Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in Dokploy}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD containing at least 12 characters}
      SEED_DEMO_USER: "false"
    expose:
      - "4000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  store:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.store
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile.admin
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:4000
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
