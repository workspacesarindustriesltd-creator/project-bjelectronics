name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and production build
        run: npm run check
      - name: Audit production dependencies
        run: npm run security:audit

  refactor-production:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/separate-apps-no-payment-gateway-2026-08-04
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded architecture migration
        run: python scripts/refactor_production_architecture.py
      - name: Refresh deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run check
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Remove one-time migration machinery
        run: rm scripts/refactor_production_architecture.py .refactor-trigger
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor production architecture and remove online payments"
          git push origin HEAD:refactor/separate-apps-no-payment-gateway-2026-08-04
