name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: true
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies in Hostinger production mode
        run: npm ci
      - name: Verify Vite build dependency is available
        run: npm exec -- vite --version
      - name: Run tests and production build
        run: npm run check
      - name: Re-verify frontend security boundaries
        run: npm run verify:security-boundaries
      - name: Validate Hostinger output package
        run: |
          npm ci --ignore-scripts --omit=dev --prefix dist
          node --check dist/index.js
          node --check dist/runtime/server/index.js
      - name: Audit production dependencies
        run: npm run security:audit
