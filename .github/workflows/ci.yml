name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and production build
        run: npm run check
      - name: Re-verify frontend security boundaries
        run: npm run verify:security-boundaries
      - name: Validate Hostinger output package
        run: |
          npm ci --ignore-scripts --omit=dev --prefix dist
          node --check dist/index.js
          node --check dist/runtime/server/index.js
      - name: Audit production dependencies
        run: npm run security:audit
