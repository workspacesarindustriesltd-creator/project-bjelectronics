name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and production build
        run: npm run check
      - name: Audit production dependencies
        run: npm run security:audit

  refactor-production:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/separate-apps-no-payment-gateway-2026-08-04
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply guarded architecture migration
        run: python scripts/refactor_production_architecture.py || test -f ARCHITECTURE.md
      - name: Remove final legacy dashboard wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.jsx')
          source = path.read_text()
          source = source.replace(
              'Products, inventory, orders and payment health in one workspace.',
              'Products, inventory, orders and fulfillment health in one workspace.',
          )
          source = source.replace(
              '<article><span>Payment success</span><strong>98.4%</strong><b>SSLCOMMERZ healthy</b><ShieldCheck /></article>',
              '<article><span>Checkout methods</span><strong>2 active</strong><b>COD and bank transfer</b><ShieldCheck /></article>',
          )
          path.write_text(source)
          PY
      - name: Verify permanent gateway removal
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          root = Path('.')
          excluded = {
              Path('scripts/refactor_production_architecture.py'),
              Path('database/migrations/004_remove_online_payment_gateway.sql'),
          }
          patterns = re.compile(r'ssl\s*commerz|sslcommerz|SSLCOMMERZ_|/api/payments/', re.I)
          failures = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts or path in excluded:
                  continue
              if path.suffix.lower() not in {'.js', '.jsx', '.mjs', '.json', '.md', '.sql', '.yml', '.yaml', '.example', '.css', '.html'}:
                  continue
              text = path.read_text(errors='ignore')
              if patterns.search(text) or 'payment_provider' in text:
                  failures.append(str(path))
          if failures:
              raise SystemExit('Obsolete gateway references remain: ' + ', '.join(failures))
          PY
      - name: Refresh deterministic dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Run complete verification
        run: npm run check
      - name: Audit production dependencies
        run: npm run security:audit
      - name: Remove one-time migration machinery
        run: rm scripts/refactor_production_architecture.py .refactor-trigger
      - name: Commit verified refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor production architecture and remove online payments"
          git push origin HEAD:refactor/separate-apps-no-payment-gateway-2026-08-04
