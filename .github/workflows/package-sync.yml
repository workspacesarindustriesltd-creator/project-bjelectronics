name: Package Sync

on:
  push:
    branches:
      - upgrade/admin-enterprise-control-center
    paths:
      - .github/workflows/package-sync.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v6
        with:
          ref: upgrade/admin-enterprise-control-center
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Upgrade runtime dependencies
        run: >-
          npm install --save-exact
          bcryptjs@3.0.3 cookie-parser@1.4.7 cors@2.8.6 dotenv@17.4.2
          express@5.2.1 express-rate-limit@8.6.2 helmet@8.3.0
          jsonwebtoken@9.0.3 mysql2@3.23.2 zod@4.4.3
      - name: Upgrade build and test dependencies
        run: >-
          npm install --save-dev --save-exact
          @phosphor-icons/react@2.1.10 @vitejs/plugin-react@5.2.0
          concurrently@9.2.4 react@19.2.8 react-dom@19.2.8
          supertest@7.2.2 vite@7.3.6
      - name: Normalize package metadata
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const file = "package.json";
          const manifest = JSON.parse(readFileSync(file, "utf8"));
          manifest.version = "4.2.0";
          manifest.engines = { node: ">=22.12 <23", npm: ">=10.9.0" };
          manifest.scripts.build = "npm run build:store && npm run build:admin && node scripts/prepare-production-build.mjs && node scripts/write-runtime-version.mjs && npm run verify:security-boundaries";
          manifest.scripts["verify:source"] = "node scripts/verify-source-quality.mjs";
          manifest.scripts.check = "npm run verify:source && npm run build && npm test";
          manifest.scripts.ci = "npm run check && npm run security:audit";
          writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Verify upgraded application
        run: npm run ci
      - name: Commit synchronized lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Upgrade compatible production packages" || exit 0
          git push origin HEAD:upgrade/admin-enterprise-control-center
